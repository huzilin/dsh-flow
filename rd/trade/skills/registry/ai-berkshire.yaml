name: ai-berkshire
version: "latest"
repo_url: https://github.com/xbtlin/ai-berkshire.git
local_path: ./skills/plugin/ai-berkshire
branch: main

skills:
  - id: investment-research
    display_name: 深度投资研究
    description: 单公司深度投资研究工作流
    skill_file: skills/investment-research.md
    category: analyst
    risk_tolerance: moderate
    focus_areas:
      - 商业模式
      - 护城河
      - 管理层
      - 财务分析
      - 估值
    required_params:
      - name: symbol
        type: string
        description: 股票代码
      - name: trade_date
        type: string
        description: 交易日期
    optional_params:
      - name: depth
        type: string
        default: normal
        description: 分析深度（normal/deep）

  - id: investment-team
    display_name: 投资团队分析
    description: 四大师并行分析工作流
    skill_file: skills/investment-team.md
    category: workflow
    risk_tolerance: moderate
    focus_areas:
      - 综合分析
      - 价值投资
      - 成长投资
      - 宏观分析
    required_params:
      - name: symbol
        type: string
        description: 股票代码

  - id: bottleneck-hunter
    display_name: 供应链瓶颈猎手
    description: AI驱动的全球产业链瓶颈套利分析
    skill_file: skills/bottleneck-hunter.md
    category: analyst
    risk_tolerance: aggressive
    focus_areas:
      - 供应链
      - 产业链
      - 瓶颈分析
      - 套利机会
    required_params:
      - name: industry
        type: string
        description: 目标行业
    optional_params:
      - name: region
        type: string
        default: global
        description: 区域范围

  - id: industry-funnel
    display_name: 行业漏斗筛选
    description: 从赛道到公司的漏斗式筛选
    skill_file: skills/industry-funnel.md
    category: workflow
    risk_tolerance: moderate
    focus_areas:
      - 行业分析
      - 赛道筛选
      - 公司评估
      - 估值排序
    required_params:
      - name: sector
        type: string
        description: 行业板块
    optional_params:
      - name: limit
        type: int
        default: 10
        description: 筛选数量

  - id: news-pulse
    display_name: 新闻脉搏
    description: 多源新闻侦察与市场情绪分析
    skill_file: skills/news-pulse.md
    category: analyst
    risk_tolerance: moderate
    focus_areas:
      - 新闻分析
      - 市场情绪
      - 事件归因
      - 舆情监测
    optional_params:
      - name: company
        type: string
        description: 目标公司（为空则分析大盘）
      - name: limit
        type: int
        default: 5
        description: 返回条数

  - id: earnings-review
    display_name: 财报精读
    description: 财报深度解读与关键指标分析
    skill_file: skills/earnings-review.md
    category: analyst
    risk_tolerance: conservative
    focus_areas:
      - 财报分析
      - 盈利质量
      - 财务健康
      - 业绩预测
    required_params:
      - name: symbol
        type: string
        description: 股票代码
      - name: period
        type: string
        description: 财报期（如 2024Q1）

  - id: industry-research
    display_name: 行业研究
    description: 行业扫描与投资地图绘制
    skill_file: skills/industry-research.md
    category: analyst
    risk_tolerance: moderate
    focus_areas:
      - 行业格局
      - 竞争态势
      - 发展趋势
      - 投资机会
    required_params:
      - name: sector
        type: string
        description: 行业板块

  - id: investment-checklist
    display_name: 投资检查清单
    description: 投资决策检查清单验证
    skill_file: skills/investment-checklist.md
    category: analyst
    risk_tolerance: conservative
    focus_areas:
      - 尽职调查
      - 风险评估
      - 投资纪律
      - 决策验证
    required_params:
      - name: symbol
        type: string
        description: 股票代码

  - id: deep-company-series
    display_name: 深度公司系列
    description: 商业模式、护城河、管理层深度研究
    skill_file: skills/deep-company-series.md
    category: analyst
    risk_tolerance: conservative
    focus_areas:
      - 商业模式
      - 竞争优势
      - 管理层
      - 长期价值
    required_params:
      - name: symbol
        type: string
        description: 股票代码

  - id: earnings-team
    display_name: 财报团队分析
    description: 多维度财报分析团队协作
    skill_file: skills/earnings-team.md
    category: workflow
    risk_tolerance: moderate
    focus_areas:
      - 财报分析
      - 财务健康
      - 盈利预测
      - 估值调整
    required_params:
      - name: symbol
        type: string
        description: 股票代码

  - id: financial-data
    display_name: 金融数据工具
    description: 金融数据查询与分析工具集
    skill_file: skills/financial-data.md
    category: analyst
    risk_tolerance: conservative
    focus_areas:
      - 数据查询
      - 指标计算
      - 财务建模
      - 数据分析

  - id: income-investment
    display_name: 收益型投资
    description: 股息投资与收益策略分析
    skill_file: skills/income-investment.md
    category: strategy
    risk_tolerance: conservative
    focus_areas:
      - 股息率
      - 分红稳定性
      - 收益策略
      - 防御投资

  - id: management-deep-dive
    display_name: 管理层深度分析
    description: 管理层质量与资本配置能力评估
    skill_file: skills/management-deep-dive.md
    category: analyst
    risk_tolerance: moderate
    focus_areas:
      - 管理层
      - 资本配置
      - 治理结构
      - 企业文化
    required_params:
      - name: symbol
        type: string
        description: 股票代码

  - id: portfolio-review
    display_name: 投资组合回顾
    description: 投资组合绩效分析与优化建议
    skill_file: skills/portfolio-review.md
    category: analyst
    risk_tolerance: moderate
    focus_areas:
      - 组合分析
      - 绩效评估
      - 风险控制
      - 优化建议

  - id: private-company-research
    display_name: 私有公司研究
    description: 未上市公司投资研究分析
    skill_file: skills/private-company-research.md
    category: analyst
    risk_tolerance: aggressive
    focus_areas:
      - 私募投资
      - 未上市企业
      - 成长性评估
      - 估值方法
    required_params:
      - name: company
        type: string
        description: 公司名称

  - id: quality-screen
    display_name: 质量筛选
    description: 高质量企业筛选与排名
    skill_file: skills/quality-screen.md
    category: workflow
    risk_tolerance: conservative
    focus_areas:
      - 质量因子
      - 企业筛选
      - 排名评估
      - 投资组合构建

  - id: thesis-drift
    display_name: 投资逻辑漂移检测
    description: 跟踪投资逻辑与事实的偏离
    skill_file: skills/thesis-drift.md
    category: analyst
    risk_tolerance: conservative
    focus_areas:
      - 逻辑验证
      - 事实跟踪
      - 偏差检测
      - 投资纪律
    required_params:
      - name: symbol
        type: string
        description: 股票代码

  - id: thesis-tracker
    display_name: 投资逻辑跟踪器
    description: 投资逻辑的持续跟踪与更新
    skill_file: skills/thesis-tracker.md
    category: analyst
    risk_tolerance: conservative
    focus_areas:
      - 逻辑跟踪
      - 动态更新
      - 里程碑管理
      - 决策记录
    required_params:
      - name: symbol
        type: string
        description: 股票代码

  - id: dyp-ask
    display_name: 段永平问答
    description: 以段永平投资哲学回答问题
    skill_file: skills/dyp-ask.md
    category: strategy
    risk_tolerance: conservative
    focus_areas:
      - 价值投资
      - 企业理解
      - 长期持有
      - 商业模式

  - id: wechat-article
    display_name: 微信文章分析
    description: 微信公众号文章投资观点分析
    skill_file: skills/wechat-article.md
    category: analyst
    risk_tolerance: moderate
    focus_areas:
      - 文章分析
      - 观点提炼
      - 投资逻辑
      - 信息验证
    required_params:
      - name: url
        type: string
        description: 文章链接

category_groups:
  - name: 投资研究
    skills: [investment-research, deep-company-series, management-deep-dive]
  - name: 团队分析
    skills: [investment-team, earnings-team]
  - name: 行业分析
    skills: [industry-research, industry-funnel, quality-screen]
  - name: 财报分析
    skills: [earnings-review, financial-data]
  - name: 专项分析
    skills: [bottleneck-hunter, news-pulse, thesis-drift, thesis-tracker]
  - name: 投资策略
    skills: [investment-checklist, income-investment, dyp-ask]
  - name: 组合管理
    skills: [portfolio-review]